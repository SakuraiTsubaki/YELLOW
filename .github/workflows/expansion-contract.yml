name: Expansion contract

on:
  push:
    paths:
      - "include/yellow/**"
      - "config/**"
      - "manifests/**"
      - "research/**"
      - "tools/**"
      - "docs/**"
      - "tests/**"
      - ".github/workflows/expansion-contract.yml"
  pull_request:
    paths:
      - "include/yellow/**"
      - "config/**"
      - "manifests/**"
      - "research/**"
      - "tools/**"
      - "docs/**"
      - "tests/**"
      - ".github/workflows/expansion-contract.yml"

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout YELLOW
        uses: actions/checkout@v4

      - name: Checkout pinned pokeemerald-expansion
        uses: actions/checkout@v4
        with:
          repository: rh-hideout/pokeemerald-expansion
          ref: 75b806a3ab57a81ff1eb6179288981f0b3cc3050
          path: _upstream/pokeemerald-expansion

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate YELLOW contracts
        run: python -m unittest discover -s tests -v

      - name: Audit pinned engine before widening
        run: python tools/audit_gen10_storage.py _upstream/pokeemerald-expansion --mode baseline --json

      - name: Apply Gen10 persistent-storage Stage 1
        run: python tools/patch_gen10_storage_stage1.py _upstream/pokeemerald-expansion

      - name: Audit widened persistent storage
        run: python tools/audit_gen10_storage.py _upstream/pokeemerald-expansion --mode patched --json
