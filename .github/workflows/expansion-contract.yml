name: Expansion contract

on:
  push:
    paths:
      - "include/yellow/**"
      - "config/expansion.json"
      - "manifests/**"
      - "research/rom-save-evidence.md"
      - "tools/yellow_rom_save_audit.py"
      - "docs/EXPANSION_ARCHITECTURE.md"
      - "tests/test_expansion_contract.py"
      - "tests/test_yellow_rom_save_audit.py"
      - ".github/workflows/expansion-contract.yml"
  pull_request:
    paths:
      - "include/yellow/**"
      - "config/expansion.json"
      - "manifests/**"
      - "research/rom-save-evidence.md"
      - "tools/yellow_rom_save_audit.py"
      - "docs/EXPANSION_ARCHITECTURE.md"
      - "tests/test_expansion_contract.py"
      - "tests/test_yellow_rom_save_audit.py"

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate future-ready expansion and legacy save contracts
        run: python -m unittest discover -s tests -v
