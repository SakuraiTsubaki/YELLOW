name: Expansion contract

on:
  push:
    paths:
      - "asm/**"
      - "include/yellow/**"
      - "config/**"
      - "manifests/**"
      - "research/**"
      - "tools/**"
      - "docs/**"
      - "tests/**"
      - ".github/workflows/expansion-contract.yml"
  pull_request:
    paths:
      - "asm/**"
      - "include/yellow/**"
      - "config/**"
      - "manifests/**"
      - "research/**"
      - "tools/**"
      - "docs/**"
      - "tests/**"
      - ".github/workflows/expansion-contract.yml"

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout YELLOW
        uses: actions/checkout@v4

      - name: Checkout structural Yellow reference
        uses: actions/checkout@v4
        with:
          repository: pret/pokeyellow
          ref: e89ead154b9968aa50eed9328ff2b38b6c194382
          path: _reference/pokeyellow

      - name: Checkout integration Yellow reference
        uses: actions/checkout@v4
        with:
          repository: pret/pokeyellow
          ref: e89ead154b9968aa50eed9328ff2b38b6c194382
          path: _integration/pokeyellow

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate original-Game-Boy expansion contracts
        run: python -m unittest discover -s tests -v

      - name: Audit stock 8-bit runtime chokepoints
        run: python tools/audit_runtime_id_widths.py _reference/pokeyellow --json

      - name: Audit stock mapper write surfaces
        run: python tools/audit_mapper_paths.py --source-root _reference/pokeyellow --json

      - name: Checkout RGBDS
        uses: actions/checkout@v4
        with:
          repository: gbdev/rgbds
          ref: v1.0.3
          path: _tools/rgbds

      - name: Install RGBDS
        working-directory: _tools/rgbds
        run: |
          sudo apt-get update
          sudo apt-get install -yq bison libpng-dev pkg-config
          sudo make -j$(nproc) install

      - name: Assemble YELLOW expansion ABI harness
        run: |
          rgbasm -Wall -Wextra -o /tmp/yellow-expansion.o tests/asm/expansion_harness.asm
          rgblink -o /tmp/yellow-expansion.gb /tmp/yellow-expansion.o

      - name: Link SRAM runtime service harness
        run: |
          rgbasm -Wall -Wextra -o /tmp/yellow-sram-service.o tests/asm/sram_service_harness.asm
          rgblink -n /tmp/yellow-sram-service.sym -m /tmp/yellow-sram-service.map -o /tmp/yellow-sram-service.gb /tmp/yellow-sram-service.o
          python tools/verify_sram_service_symbols.py /tmp/yellow-sram-service.sym --json
          echo "=== SRAM service map ==="
          cat /tmp/yellow-sram-service.map

      - name: Build structural Yellow reference with map
        run: make -C _reference/pokeyellow -j$(nproc) DEBUG=1 yellow

      - name: Report structural Yellow bank slack
        run: |
          echo "=== map head ==="
          sed -n '1,220p' _reference/pokeyellow/pokeyellow.map
          echo "=== map memory tail ==="
          tail -n 220 _reference/pokeyellow/pokeyellow.map
          echo "=== free/empty/slack markers ==="
          grep -i -E "free|empty|slack|used|total" _reference/pokeyellow/pokeyellow.map || true

      - name: Apply YELLOW runtime overlay
        run: python tools/apply_pokeyellow_runtime_overlay.py _integration/pokeyellow

      - name: Build integrated 2 MiB Yellow runtime
        run: make -C _integration/pokeyellow -j$(nproc) DEBUG=1 yellow

      - name: Verify integrated Yellow ROM and SRAM service
        run: |
          python tools/verify_integrated_yellow_rom.py _integration/pokeyellow/pokeyellow.gbc --json
          python tools/verify_sram_service_symbols.py _integration/pokeyellow/pokeyellow.sym --json
          echo "=== integrated expansion symbols ==="
          grep -E "Yellow(SRAM|Copy|Resolve|SetROM|RestoreLegacy)" _integration/pokeyellow/pokeyellow.sym || true
