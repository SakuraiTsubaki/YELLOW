name: Expansion contract

on:
  push:
    paths:
      - "include/yellow/**"
      - "config/**"
      - "manifests/**"
      - "research/**"
      - "tools/**"
      - "docs/**"
      - "tests/**"
      - ".github/workflows/expansion-contract.yml"
  pull_request:
    paths:
      - "include/yellow/**"
      - "config/**"
      - "manifests/**"
      - "research/**"
      - "tools/**"
      - "docs/**"
      - "tests/**"
      - ".github/workflows/expansion-contract.yml"

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate original-Game-Boy expansion contracts
        run: python -m unittest discover -s tests -v
