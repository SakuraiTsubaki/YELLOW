schema_version: 1
project: YELLOW
upstream:
  repository: rh-hideout/pokeemerald-expansion
  commit: 75b806a3ab57a81ff1eb6179288981f0b3cc3050

stage1:
  status: implemented_as_verified_patch
  goal: widen the two nearest persistent-ID limits without growing BoxPokemon
  boxpokemon_bytes_before: 80
  boxpokemon_bytes_after: 80
  fields:
    species:
      upstream_bits: 11
      upstream_max_id: 2047
      pinned_count: 1573
      pinned_headroom: 475
      yellow_bits: 16
      yellow_max_valid_id: 65534
      high_bits_storage:
        speciesHighMid: 3
        speciesHighTop: 2
    held_item:
      upstream_bits: 10
      upstream_max_id: 1023
      pinned_count: 874
      pinned_headroom: 150
      yellow_bits: 16
      yellow_max_valid_id: 65534
      high_bits_storage:
        heldItemHigh: 6
  compatibility:
    old_save_high_bits_zero: true
    boxpokemon_struct_size_changed: false
    encrypted_substruct_size_changed: false
    checksum_algorithm_changed: false

stage2:
  status: next
  fields:
    move:
      upstream_bits: 11
      regular_pinned_count: 848
      low_id_max: 2047
      target_bits: 16
      reason: four moves require 20 additional persistent bits per Pokemon
    tera_type:
      upstream_bits: 5
      low_id_max: 31
      target_policy: extended_escape_or_sidecar
    pokeball:
      upstream_bits: 6
      low_id_max: 63
      target_policy: extended_escape_or_sidecar
    met_location:
      upstream_bits: 8
      low_id_max: 255
      target_policy: project_location_indirection_or_sidecar
  saveblock3:
    max_bytes: 1624
    default_pin_features:
      dexnav_search_levels: false
      npc_follower: false
      fake_rtc: false
      first_time_item_descriptions: false
    rule: do_not_assume_all_1624_bytes_are_permanently_free
    requirement: reserve_versioned_sidecar_before enabling optional consumers

policy:
  future_generation_boundary: 10
  guess_future_counts: false
  fail_build_when_persistent_encoding_cannot_represent_enabled_content: true
  preserve_legacy_yellow_import_profiles: true
