schema_version: 1
project: YELLOW
target_platform: Game Boy Advance

rom:
  addressing: native_game_pak
  base_address: 0x08000000
  end_address_exclusive: 0x0A000000
  max_bytes: 33554432
  max_mib: 32
  policy: use_full_native_capacity
  release_image_ceiling_mib: 32
  custom_mapper_over_32_mib: false
  rationale: >
    Standard GBA Game Pak ROM addressing exposes a 32 MiB cartridge image.
    Larger GBA Video cartridges depend on special bank-switching hardware and
    are intentionally outside YELLOW's normal hardware compatibility target.

engine_reference:
  repository: rh-hideout/pokeemerald-expansion
  commit: 75b806a3ab57a81ff1eb6179288981f0b3cc3050
  linker_script: ld_script_modern.ld
  linker_rom_origin: 0x08000000
  linker_rom_length: 32M

budget_policy:
  hard_fail_over_bytes: 33554432
  warn_at_percent: 90
  reserve_tail_bytes: 262144
  reserve_tail_purpose:
    - emergency_data_growth
    - alignment
    - late_generation_tables
  usable_before_reserve_bytes: 33292288

save:
  note: ROM capacity and persistent save capacity are separate budgets
  original_yellow_legacy_sram_bytes: 32768
  gba_runtime_save_policy: versioned_engine_save
  do_not_measure_save_growth_against_rom_mib: true
