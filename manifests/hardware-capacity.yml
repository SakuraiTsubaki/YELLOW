schema_version: 2
project: YELLOW
target_platform: Game Boy / Super Game Boy / Game Boy Color

source_rom:
  bytes: 1048576
  mib: 1
  banks: 64
  bank_size_bytes: 16384

legacy_profiles:
  japanese:
    cartridge_type: 0x13
    mapper: MBC3+RAM+BATTERY
    rom_bytes: 1048576
    sram_bytes: 32768
    mapper_rom_ceiling_bytes: 2097152
    mapper_rom_ceiling_banks: 128
  international:
    cartridge_type: 0x1B
    mapper: MBC5+RAM+BATTERY
    rom_bytes: 1048576
    sram_bytes: 32768

expanded_profile:
  mapper: MBC5+RAM+BATTERY
  cartridge_type: 0x1B
  rom_size_header_code: 0x08
  rom_max_bytes: 8388608
  rom_max_mib: 8
  rom_banks: 512
  rom_bank_bits: 9
  ram_size_header_code: 0x04
  sram_max_bytes: 131072
  sram_max_kib: 128
  sram_banks: 16
  ram_bank_bits: 4
  fill_byte: 0xFF

requirements:
  - preserve every source ROM hash as immutable evidence
  - expanded builds are derived outputs, never replacements for source ROMs
  - patch MBC5 ROMB1 high bank bit before allocating banks 256..511
  - audit every u8 ROM-bank field before crossing bank 255
  - use bank+address references for data that can move above the first 4 MiB
  - version the expanded SRAM schema
  - keep JP and international legacy save readers separate
  - do not use GBA capacity or save assumptions in this project
