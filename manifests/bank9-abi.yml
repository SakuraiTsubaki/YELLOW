schema_version: 2
project: YELLOW
status: data_only_upper_banks_defined

mbc5:
  low_register: 0x2000
  high_register: 0x3000
  bank_bits: 9
  max_bank: 511

execution_policy:
  executable_bank_min: 0
  executable_bank_max: 255
  upper_bank_min: 256
  upper_bank_max: 511
  upper_banks_are_data_only: true
  invariant: ROMB1 must be zero whenever legacy code or interrupts can run

reason:
  - stock Yellow tracks active ROM banks in one byte
  - verified retail ROMs contain no direct 0x3000 high-bank writes
  - structural source has direct rROMB writes outside the common bank routine
  - making upper banks data-only avoids corrupting VBlank/interrupt bank restoration

new_abi:
  pointer_encoding: farptr9
  pointer_bytes: 3
  bank_bits: 9
  romx_offset_bits: 14
  copy_primitive: YellowCopyFromBank9Locked
  copy_preconditions:
    - interrupts disabled
    - ROMB1 zero on entry
    - hLoadedROMBank contains current legacy low bank
  copy_postconditions:
    - original low bank restored
    - ROMB1 cleared
    - no code executed from bank 256..511

integration_rules:
  - high-bank records are copied to WRAM before consumption
  - legacy farcall/farjp remains restricted to banks below 256
  - do not persist 9-bit bank values in stock one-byte bank variables
  - Japanese MBC3 runtime still requires mapper migration before using this ABI
  - SRAM 128 KiB migration is separate from ROM bank migration

evidence:
  mapper_audit: manifests/mapper-write-audit.yml
  actual_rom_summary: research/mapper-write-summary.csv
